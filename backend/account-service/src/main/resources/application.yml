spring:
  application:
    name: account-service
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  datasource:
    username: postgres
    password: postgres
    url: jdbc:postgresql://${SPRING_DATASOURCE_URL:localhost:5432}/account_db
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    url: ${spring.datasource.url}
springdoc:
  swagger-ui:
    operations-sorter: method
application:
  config: 
    open-api: 
      security:
        bearer-token: bearerAuth
  openFeign:
    stock-service:
      name: stock-service
      url: ${APPLICATION_CONFIG_CATEGORY_SERVICE_URL:http://localhost:8070}/api/v1/stocks
server:
  port: 8062
  servlet:
    context-path: /api/v1